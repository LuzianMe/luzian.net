<!DOCTYPE html>
<html lang="en">

<head>
	<link rel="icon" href="../assets/ouro.ico" type="image/x-icon">
	<meta charset="UTF-8">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Luzian's Contact Information">
	<!-- Open Graph meta tags -->
	<meta property="og:title" content="Contact Me - Luzian">
	<meta property="og:description" content="Connect with Luzian through Discord, LinkedIn, GitHub, and more.">
	<meta property="og:image" content="https://luzian.net/assets/og-image.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta property="og:image:alt" content="Luzian logo over a glowing ouroboros">
	<meta property="og:site_name" content="Luzian">
	<meta name="twitter:card" content="summary_large_image">
	<!-- Thumbnail URL -->
	<meta property="og:url" content="https://luzian.net/contact/"> <!-- Page URL -->
	<link rel="canonical" href="https://luzian.net/contact/">
	<meta property="og:type" content="website">
	<title>Luzian | Contact Me</title>
	<link rel="stylesheet" href="../assets/style.css?v=20260929b">
	<script>
		document.documentElement.style.setProperty('--rotator-delay', `-${(Date.now() / 1000 % 120).toFixed(3)}s`);
	</script>
</head>

<body>
	<!-- Ambient Visual Background Layers -->
	<div class="ouro-bg-rotator" aria-hidden="true"></div>
	<canvas id="ambient-canvas" aria-hidden="true"></canvas>
	<div class="spotlight-overlay" aria-hidden="true"></div>

	<div class="page-bg">
		<nav class="nav-container" aria-label="Main Navigation">
			<ul class="nav-pills">
				<li><a href="/" class="nav-pill">Home</a></li>
				<li><a href="/contact/" class="nav-pill active">Contact</a></li>
				<li><a href="/payment/" class="nav-pill">Payments</a></li>
			</ul>
		</nav>
		<header>
			<img src="../assets/logo.svg" alt="Logo" class="logo">
			<p class="shimmer-text">Computer Science Engineer | Technology Enthusiast</p>
		</header>
		<main>
			<section id="links">
				<h2>Contact Me</h2>
				<div class="grid">
					<button type="button" class="grid-item" id="copyEmail" title="Copy Email (me@luzian.net)">
						<img src="../assets/email-icon.svg" alt="Email Icon" class="grid-icon">
						<p>Email</p>
					</button>
					<a href="https://discordapp.com/users/490539308147671051" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Connect with me on Discord">
						<img src="../assets/discord-icon.svg" alt="Discord Icon" class="grid-icon">
						<p>Discord</p>
					</a>
					<a href="tel:+16232264417" class="grid-item" title="Call Virtual Phone (+1 623 226 4417)">
						<img src="../assets/phone-icon.svg" alt="Phone Icon" class="grid-icon">
						<p>Virtual Phone</p>
					</a>
					<a href="../assets/contact.vcf" class="grid-item" download="Luzian.vcf"
						title="Save contact card to your phone or computer">
						<img src="../assets/contact-icon.svg" alt="Contact Card Icon" class="grid-icon">
						<p>Save Contact</p>
					</a>
					<a href="https://www.linkedin.com/in/luciano-melendrez-3a9b1682/" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Visit my LinkedIn profile">
						<img src="../assets/linkedin-icon.svg" alt="LinkedIn Icon" class="grid-icon">
						<p>LinkedIn</p>
					</a>
					<a href="https://github.com/LuzianMe" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Check out my GitHub">
						<img src="../assets/github-icon.svg" alt="GitHub Icon" class="grid-icon">
						<p>GitHub</p>
					</a>
					<a href="https://bsky.app/profile/luzian.net" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Find me on Bluesky">
						<img src="../assets/bluesky-icon.svg" alt="Bluesky Icon" class="grid-icon">
						<p>Bluesky</p>
					</a>
					<button type="button" class="grid-item" id="share-trigger" title="Show a QR code of this page">
						<img src="../assets/qr-icon.svg" alt="" class="grid-icon">
						<p>Share</p>
					</button>
				</div>
			</section>
		</main>
		<!-- Modals live outside #links: its backdrop-filter would trap position:fixed inside the card -->
		<!-- Modal: QR code of this page, for sharing in person -->
		<div id="share-modal" class="modal" role="dialog" aria-modal="true" aria-label="Share my contact page">
			<div class="modal-content">
				<button type="button" class="close" data-close aria-label="Close">&times;</button>
				<div class="qr-container">
					<img src="../assets/contact-qr.svg" alt="QR code linking to luzian.net/contact" class="qr-image qr-share">
					<p class="qr-legend">Scan to open <b>luzian.net/contact</b></p>
				</div>
				<button type="button" class="modal-action" id="share-link">Copy link</button>
			</div>
		</div>
		<footer>
			<p>&copy; <span id="current-year">2026</span> Luzian. All rights reserved.</p>
		</footer>
		<script src="../assets/copy.js?v=20260929b"></script>
		<script src="script.js?v=20260929b"></script>
		<script src="../assets/effects.js?v=20260929b"></script>
	</div>
</body>

</html>
