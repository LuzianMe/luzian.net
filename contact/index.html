		<header>
			<img src="../assets/logo.svg" alt="Luzian" class="logo">
			<p class="shimmer-text">Computer Science Engineer&nbsp;| Technology Enthusiast</p>
		</header>
		<main id="main" tabindex="-1">
			<section id="links">
				<h1>Contact Me</h1>
				<div class="grid">
					<a href="https://www.linkedin.com/in/luciano-melendrez-3a9b1682/" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Visit my LinkedIn profile">
						<img src="../assets/linkedin-icon.svg" alt="" class="grid-icon">
						<p>LinkedIn</p>
					</a>
					<button type="button" class="grid-item" id="copyEmail" title="Copy Email (me@luzian.net)">
						<img src="../assets/email-icon.svg" alt="" class="grid-icon">
						<p>Email</p>
					</button>
					<a href="https://github.com/LuzianMe" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Check out my GitHub">
						<img src="../assets/github-icon.svg" alt="" class="grid-icon">
						<p>GitHub</p>
					</a>
					<a href="https://bsky.app/profile/luzian.net" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Find me on Bluesky">
						<img src="../assets/bluesky-icon.svg" alt="" class="grid-icon">
						<p>Bluesky</p>
					</a>
					<a href="https://discordapp.com/users/490539308147671051" class="grid-item" target="_blank"
						rel="noopener noreferrer" title="Connect with me on Discord">
						<img src="../assets/discord-icon.svg" alt="" class="grid-icon">
						<p>Discord</p>
					</a>
					<a href="tel:+16232264417" class="grid-item" title="Call Virtual Phone (+1 623 226 4417)">
						<img src="../assets/phone-icon.svg" alt="" class="grid-icon">
						<p>Virtual Phone</p>
					</a>
					<a href="../assets/contact.vcf" class="grid-item" download="Luzian.vcf"
						title="Save contact card to your phone or computer">
						<img src="../assets/contact-icon.svg" alt="" class="grid-icon">
						<p>Save Contact</p>
					</a>
					<button type="button" class="grid-item" id="share-trigger" title="Show a QR code of this page">
						<img src="../assets/qr-icon.svg" alt="" class="grid-icon">
						<p>Share</p>
					</button>
				</div>
			</section>
		</main>
		<!-- Modals live outside #links: its backdrop-filter would trap position:fixed inside the card -->
		<!-- Modal: QR code of this page, for sharing in person -->
		<div id="share-modal" class="modal" role="dialog" aria-modal="true" aria-label="Share my contact page">
			<div class="modal-content">
				<button type="button" class="close" data-close aria-label="Close">&times;</button>
				<div class="qr-container">
					<img src="../assets/contact-qr.svg" alt="QR code linking to luzian.net/contact" class="qr-image qr-share">
					<p class="qr-legend">Scan to open <b>luzian.net/contact</b></p>
				</div>
				<button type="button" class="modal-action" id="share-link">Copy link</button>
			</div>
