<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../assets/ouro.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0d111b">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Luzian's Payment Methods">
  <!-- Open Graph meta tags -->
  <meta property="og:title" content="Pay Me - Luzian">
  <meta property="og:description" content="Send Luzian a payment through Zelle, Venmo, Cash App or PayPal.">
  <meta property="og:image" content="https://luzian.net/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Luzian logo over a glowing ouroboros">
  <meta property="og:site_name" content="Luzian">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Thumbnail URL -->
  <meta property="og:url" content="https://luzian.net/payment/"> <!-- Page URL -->
  <link rel="canonical" href="https://luzian.net/payment/">
  <meta property="og:type" content="website">
  <title>Luzian | Pay Me</title>
  <link rel="stylesheet" href="../assets/style.css?v=20261005a">
  <script>
    document.documentElement.style.setProperty('--rotator-delay', `-${(Date.now() / 1000 % 120).toFixed(3)}s`);
  </script>
</head>

<body>
  <!-- Ambient Visual Background Layers -->
  <div class="ouro-bg-rotator" aria-hidden="true"></div>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>
  <div class="spotlight-overlay" aria-hidden="true"></div>

  <div class="page-bg">
    <nav class="nav-container" aria-label="Main Navigation">
      <ul class="nav-pills">
        <li><a href="/" class="nav-pill">Home</a></li>
        <li><a href="/setup/" class="nav-pill">Setup</a></li>
        <li><a href="/contact/" class="nav-pill">Contact</a></li>
      </ul>
    </nav>
    <header>
      <img src="../assets/logo.svg" alt="Luzian" class="logo">
      <p class="shimmer-text">Computer Science Engineer&nbsp;| Technology Enthusiast</p>
    </header>
    <main>
      <section id="links">
        <h2>Pay Me</h2>
        <div class="grid">
          <div class="grid-item pay-item" data-brand="zelle">
            <img src="../assets/zelle-icon.svg" alt="" class="grid-icon">
            <p class="pay-name">Zelle</p>
            <p class="pay-handle">me<wbr>@luzian.net</p>
            <div class="pay-actions">
              <button type="button" class="pay-btn" id="zelle-trigger" aria-label="Show Zelle QR code">QR</button>
              <button type="button" class="pay-btn" data-copy="me@luzian.net" aria-label="Copy Zelle me@luzian.net">Copy</button>
            </div>
          </div>
          <div class="grid-item pay-item" data-brand="venmo">
            <img src="../assets/venmo-icon.svg" alt="" class="grid-icon">
            <p class="pay-name">Venmo</p>
            <p class="pay-handle">@LuzianMe</p>
            <div class="pay-actions">
              <a href="https://venmo.com/u/LuzianMe" class="pay-btn" target="_blank" rel="noopener noreferrer" aria-label="Open Venmo">Open</a>
              <button type="button" class="pay-btn" data-copy="@LuzianMe" aria-label="Copy Venmo @LuzianMe">Copy</button>
            </div>
          </div>
          <div class="grid-item pay-item" data-brand="cashapp">
            <img src="../assets/cashapp-icon.svg" alt="" class="grid-icon">
            <p class="pay-name">Cash App</p>
            <p class="pay-handle">$LuzianMe</p>
            <div class="pay-actions">
              <a href="https://cash.app/$LuzianMe" class="pay-btn" target="_blank" rel="noopener noreferrer" aria-label="Open Cash App">Open</a>
              <button type="button" class="pay-btn" data-copy="$LuzianMe" aria-label="Copy Cash App $LuzianMe">Copy</button>
            </div>
          </div>
          <div class="grid-item pay-item" data-brand="paypal">
            <img src="../assets/paypal-icon.svg" alt="" class="grid-icon">
            <p class="pay-name">PayPal</p>
            <p class="pay-handle">@LuzianMe</p>
            <div class="pay-actions">
              <a href="https://paypal.me/LuzianMe" class="pay-btn" target="_blank" rel="noopener noreferrer" aria-label="Open PayPal">Open</a>
              <button type="button" class="pay-btn" data-copy="paypal.me/LuzianMe" aria-label="Copy PayPal link">Copy</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- Modals live outside #links: its backdrop-filter would trap position:fixed inside the card -->
    <div id="zelle-modal" class="modal" role="dialog" aria-modal="true" aria-label="Zelle QR Code">
      <div class="modal-content">
        <button type="button" id="close-modal" class="close" aria-label="Close">&times;</button>
        <div class="qr-container">
          <img src="../assets/zelle-qr.svg?v=20261005a" alt="Zelle QR code for me@luzian.net" class="qr-image qr-share">
          <p class="qr-legend">Scan this with your Zelle app to pay <b>me@luzian.net</b></p>
        </div>
      </div>
    </div>
    <footer>
      <p>&copy; <span id="current-year">2026</span> Luzian. All rights reserved.</p>
    </footer>
    <script src="../assets/copy.js?v=20261005a"></script>
    <script src="script.js?v=20261005a"></script>
    <script src="../assets/effects.js?v=20261005a"></script>
  </div>
</body>

</html>
