# Runs on every pull request and every push to main:
#   check: scripts/check_site.py (files, links, language pairs, shared parts, accessibility basics)
#   smoke: scripts/smoke_test.py (opens every page in a real browser, in both themes and at phone width)
name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the site
        run: python3 scripts/check_site.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Open every page and try the features
        run: python3 scripts/smoke_test.py
